name: Build

on:
  push:
    branches: [ "master","main" ]
  pull_request:
    branches: [ "master","main" ]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build COM3D2
        run: |
          dotnet build -c Release

      - name: Publish Artifact
        uses: actions/upload-artifact@v7
        with:
          name: COM3D2.SyncGripMoveGUI.Plugin
          path: |
            /home/runner/work/COM3D2.SyncGripMoveGUI.Plugin/COM3D2.SyncGripMoveGUI.Plugin/COM3D2.SyncGripMoveGUI.Plugin/bin/Release/net35/COM3D2.SyncGripMoveGUI.Plugin.dll
